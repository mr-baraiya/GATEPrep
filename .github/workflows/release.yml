name: Build and Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create .env file from Secrets
        run: |
          echo "GEMINI_API_KEY=\"${{ secrets.GEMINI_API_KEY || 'YOUR_GEMINI_API_KEY' }}\"" > .env

      - name: Generate Keystore for CI
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=GATEPrep, O=GATEPrep, C=IN"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/GATEPrep-2027-Release.apk

      - name: Upload Build Artifact to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: GATEPrep-2027-Release-APK
          path: release/GATEPrep-2027-Release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || 'v1.0.0' }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "Publishing release for tag: $TAG"
          gh release create "$TAG" release/GATEPrep-2027-Release.apk \
            --title "GATEPrep 2027 $TAG" \
            --notes "GATEPrep 2027 Release ($TAG). Download the attached GATEPrep-2027-Release.apk to install on Android." \
            --clobber
