name: Build and Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create .env file from Secrets
        run: |
          echo "GEMINI_API_KEY=\"${{ secrets.GEMINI_API_KEY || 'YOUR_GEMINI_API_KEY' }}\"" > .env

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/GATEPrep-2027-Release.apk

      - name: Upload Build Artifact to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: GATEPrep-2027-Release-APK
          path: release/GATEPrep-2027-Release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || 'v1.0.0') }}
          files: release/GATEPrep-2027-Release.apk
          generate_release_notes: true
